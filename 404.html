<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — NextPage Studio</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;700;800&display=swap">
  <!-- Absolute path so the page also works when the server shows it for deep URLs (needs the site at the domain root) -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="notfound">
    <p class="notfound__code" aria-hidden="true">404</p>
    <h1 lang="bg">Тази страница не съществува.</h1>
    <p lang="bg" style="color:var(--muted)">Адресът може да е грешен или страницата да е преместена.</p>
    <h2 lang="en" style="font-size:1.3rem">This page doesn't exist.</h2>
    <p lang="en" style="color:var(--muted)">The address may be wrong or the page may have moved.</p>
    <a class="btn btn--primary" href="/">Начало / Back home <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
